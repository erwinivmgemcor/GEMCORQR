<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Offline — GEMCOR ERP</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1626">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Walang CDN: offline ito, kaya lahat ng kailangan ay galing sa cache. -->
<link rel="stylesheet" href="blockblast.css">

<style>
.off-bar {
  max-width: 1040px;
  margin: 0 auto;
  padding: 14px 14px 0;
}
.off-card {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .1);
  border-left: 4px solid #e2493e;
  color: #eef2f7;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
.off-card[data-state="slow"] { border-left-color: #f4b81f; }
.off-card[data-state="online"] { border-left-color: #33b27a; }
.off-logo { height: 34px; background: #fff; padding: 4px 8px; border-radius: 8px; flex: none; }
.off-msg { flex: 1; min-width: 220px; line-height: 1.35; }
.off-msg b { display: block; font-size: 1rem; }
.off-msg span { display: block; font-size: .82rem; color: #9fb3cc; margin-top: 2px; }
.off-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.off-btn {
  appearance: none; border: 0; cursor: pointer; text-decoration: none;
  font: 700 .85rem system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  padding: 10px 14px; border-radius: 10px;
  color: #eef2f7; background: rgba(255, 255, 255, .1);
}
.off-btn:hover { background: rgba(255, 255, 255, .17); }
.off-btn.go { background: #33b27a; color: #04170e; }
.off-btn.go:hover { background: #4bc98f; }
.off-btn[hidden] { display: none; }
</style>

<script>window.ERP_NETWATCH_NO_CHIP = true;</script>
<script defer src="erp-config.js"></script>
<script defer src="erp-netwatch.js"></script>
<script defer src="blockblast.js"></script>
</head>
<body class="bb-page">

<div class="off-bar">
  <div class="off-card" id="offCard" data-state="offline" role="status" aria-live="polite">
    <img class="off-logo" src="../gemcor-logo.png" alt="GEMCOR" onerror="this.style.display='none'">
    <div class="off-msg">
      <b id="offTitle">Walang internet</b>
      <span id="offSub">Hindi ma-reach ang GEMCOR ERP. Maglaro muna habang naghihintay — maiipon ang score mo at mase-save pag bumalik ang koneksyon. Hindi makakapag-submit ng request habang offline.</span>
    </div>
    <div class="off-actions">
      <button class="off-btn go" id="offReload" type="button" hidden>Mag-reload</button>
      <button class="off-btn" id="offRetry" type="button">Subukan ulit</button>
      <a class="off-btn" href="stock-monitor.html">Stock Monitor (cached)</a>
    </div>
  </div>
</div>

<div id="bbApp"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  BlockBlast.mount(document.getElementById('bbApp'), { mode: 'offline' });

  var card = document.getElementById('offCard');
  var title = document.getElementById('offTitle');
  var sub = document.getElementById('offSub');
  var reloadBtn = document.getElementById('offReload');
  var retryBtn = document.getElementById('offRetry');
  var reloadTimer = null;

  var TEXT = {
    offline: ['Walang internet', null],
    slow: ['Mabagal ang internet', 'Abot pa ang server pero mabagal. Pwede mong hintayin ito habang naglalaro, o subukang mag-reload.'],
    online: ['Bumalik na ang internet', 'Naka-sync na ang mga naipong score.']
  };
  var offlineSub = sub.textContent;

  function reloadNow() {
    // Kapag ang SW ang nag-serve ng page na ito para sa ibang URL, i-reload lang ang URL na iyon.
    if (/offline\.html$/.test(location.pathname)) location.href = 'index.html';
    else location.reload();
  }

  function paint(state) {
    card.setAttribute('data-state', state);
    var t = TEXT[state] || TEXT.offline;
    title.textContent = t[0];
    sub.textContent = t[1] || offlineSub;
    reloadBtn.hidden = (state === 'offline');
    if (reloadTimer) { clearTimeout(reloadTimer); reloadTimer = null; }
    // Kung walang laro na tumatakbo, kusa nang mag-reload. Kung may laro, huwag putulin.
    if (state === 'online') {
      if (!BlockBlast.inProgress()) reloadTimer = setTimeout(reloadNow, 1200);
      else sub.textContent = 'Tapusin muna ang laro, tapos pindutin ang Mag-reload. Naka-save ang laro mo.';
    }
  }

  window.addEventListener('erp:net', function (e) { paint(e.detail.state); });
  reloadBtn.addEventListener('click', reloadNow);
  retryBtn.addEventListener('click', function () {
    retryBtn.textContent = 'Sinusubukan…';
    window.erpNet.probe().then(function (st) {
      retryBtn.textContent = 'Subukan ulit';
      paint(st);
      if (st === 'offline') sub.textContent = 'Wala pa ring koneksyon. Susubukan ulit nang kusa.';
    });
  });

  // Tahimik na retry kada 15s — HINDI nire-reload ang page, para hindi maputol ang laro.
  setInterval(function () { window.erpNet.probe(); }, 15000);
  window.erpNet.probe().then(paint);
});
</script>
</body>
</html>
