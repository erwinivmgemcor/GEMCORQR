<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMCOR ERP — Item Catalog</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-design-system.css">
<link rel="stylesheet" href="erp-styles.css">
<link rel="stylesheet" href="erp-nav.css">
<link rel="stylesheet" href="erp-notif.css">

<style>
.ic2-code { font-family: 'Courier New', monospace; font-weight: 700; color: #1e3a5f; white-space: nowrap; }
.ic2-copy { border: 0; background: none; color: #94a3b8; padding: 0 4px; cursor: pointer; }
.ic2-copy:hover { color: #1e3a5f; }
.ic2-table th { cursor: pointer; user-select: none; white-space: nowrap; }
.ic2-table th .bi { font-size: .7rem; opacity: .5; }
.ic2-chip { background: #eef2f7; color: #334155; border-radius: 10px; padding: 2px 10px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.ic2-unit { color: #475569; font-size: .82rem; }
mark { background: #fef08a; padding: 0 1px; }
</style>

<script src="erp-theme.js"></script>
<script src="erp-guard.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="erp-config.js"></script>
<script defer src="erp-supabase.js"></script>
<script defer src="erp-nav.js"></script>
<script defer src="item-catalog.js"></script>
<script defer src="notif-alerts.js"></script>
<script defer src="notifications.js"></script>
<script defer src="js/update.js"></script>
</head>
<body>

<nav class="erp-topbar">
  <div class="erp-topbar-left">
    <img src="../gemcor-logo.png" alt="GEMCOR" class="erp-logo" onerror="this.style.display='none'">
    <div>
      <div class="erp-brand">GEMCOR ERP</div>
      <div class="erp-brand-sub">Item Catalog</div>
    </div>
  </div>
  <div id="erpNavBar"></div>
</nav>

<div class="erp-container">

  <div class="erp-page-header">
    <div>
      <div class="erp-page-title"><i class="bi bi-journal-text"></i><span>Item Catalog</span></div>
      <div class="erp-breadcrumb"><span>Existing items: code, description, category and unit (unit cost for Finance)</span></div>
    </div>
    <div>
      <button class="erp-btn-outline" onclick="icatExport()"><i class="bi bi-download"></i> <span>Export CSV</span></button>
    </div>
  </div>

  <div class="erp-card" style="padding:18px 20px;margin-bottom:16px;">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-7">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="icatSearch" class="form-control" placeholder="Search item code or description… (e.g. gloves orange)" autocomplete="off" oninput="icatOnSearch()">
          <button class="btn btn-outline-secondary" onclick="icatClear()" title="Clear"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
      <div class="col-8 col-md-3">
        <select id="icatCategory" class="form-select" onchange="icatApply()"><option value="">All categories</option></select>
      </div>
      <div class="col-4 col-md-2 text-end small text-muted" id="icatCount">…</div>
    </div>
  </div>

  <div class="erp-card" style="padding:0;overflow:hidden;">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 ic2-table">
        <thead class="table-light">
          <tr>
            <th onclick="icatSort('item_code')">Item Code <i class="bi bi-arrow-down-up"></i></th>
            <th onclick="icatSort('description')">Description <i class="bi bi-arrow-down-up"></i></th>
            <th onclick="icatSort('category')">Category <i class="bi bi-arrow-down-up"></i></th>
            <th onclick="icatSort('unit')">Unit <i class="bi bi-arrow-down-up"></i></th>
            <th id="icatCostTh" class="text-end" style="display:none" onclick="icatSort('unit_cost')">Unit Cost <i class="bi bi-arrow-down-up"></i></th>
          </tr>
        </thead>
        <tbody id="icatBody"><tr><td colspan="4" class="text-center py-5 text-muted">Loading items…</td></tr></tbody>
      </table>
    </div>
    <div class="text-center py-3 d-none" id="icatMoreWrap">
      <button class="btn btn-outline-primary btn-sm" onclick="icatMore()">Show more</button>
    </div>
  </div>

  <div id="erpToast" class="toast erp-toast"><div class="toast-body" id="erpToastBody">Message</div></div>
</div>

</body>
</html>
