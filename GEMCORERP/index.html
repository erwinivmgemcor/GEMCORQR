<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMCOR ERP</title>

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="erp-theme.js"></script>

<style>
:root {
  --gem-navy: #1e3a5f;
  --gem-navy-dark: #152a47;
  --gem-green: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--gem-navy) 0%, var(--gem-navy-dark) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.loading-container {
  text-align: center;
  padding: 40px;
}

.loading-logo {
  height: 80px;
  margin-bottom: 24px;
  background: #fff;
  padding: 8px 16px;
  border-radius: 12px;
  display: inline-block;
}

.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255, 255, 255, 0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 1rem;
  opacity: 0.9;
  letter-spacing: 0.02em;
}

.loading-subtext {
  font-size: 0.82rem;
  opacity: 0.6;
  margin-top: 8px;
}
</style>

<script>
// ═══════════════════════════════════════════════════════════
// AUTO-ROUTING — Redirect based on auth state
// ═══════════════════════════════════════════════════════════
(function() {
  try {
    var username = localStorage.getItem('ivm_username');
    var role = localStorage.getItem('ivm_userRole');
    
    // Not logged in → go to login
    if (!username || !role) {
      console.log('[Landing] No session — redirecting to login');
      window.location.replace('login.html');
      return;
    }
    
    // Logged in → go to appropriate dashboard
    console.log('[Landing] Session found:', username, '/', role);
    
    if (role === 'warehouse') {
      window.location.replace('management-dashboard.html');
    } else if (role === 'production') {
      window.location.replace('my-requests.html');
    } else {
      // Unknown role → reset session
      console.warn('[Landing] Unknown role:', role);
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace('login.html');
    }
  } catch(e) {
    console.error('[Landing] Error:', e);
    window.location.replace('login.html');
  }
})();
</script>
</head>
<body>

<div class="loading-container">
  <img src="../gemcor-logo.png" alt="GEMCOR" class="loading-logo" onerror="this.style.display='none'">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading GEMCOR ERP...</div>
  <div class="loading-subtext">Please wait</div>
</div>

</body>
</html>
