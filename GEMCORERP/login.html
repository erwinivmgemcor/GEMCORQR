<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — GEMCOR ERP</title>

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="erp-theme.js"></script>

<style>
:root {
  --gem-navy: #1e3a5f;
  --gem-navy-dark: #152a47;
  --gem-navy-light: #2a4a73;
  --gem-green: #10b981;
  --gem-green-dark: #059669;
  --gem-gray: #64748b;
  --gem-red: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--gem-navy) 0%, var(--gem-navy-dark) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}

.login-wrapper {
  width: 100%;
  max-width: 420px;
}

.login-card {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  color: #0f172a;
}

.login-header {
  background: linear-gradient(135deg, var(--gem-navy) 0%, var(--gem-navy-light) 100%);
  padding: 32px 24px 24px;
  text-align: center;
  color: #fff;
  position: relative;
}

.login-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.login-logo {
  height: 60px;
  background: #fff;
  padding: 6px 12px;
  border-radius: 10px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.login-title {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
  position: relative;
  z-index: 1;
}

.login-subtitle {
  font-size: 0.85rem;
  opacity: 0.85;
  position: relative;
  z-index: 1;
}

.login-body {
  padding: 28px 28px 24px;
}

/* ═══ Role Selection ═══ */
.role-selection {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.role-card {
  padding: 20px 16px;
  border: 2px solid #e2e8f0;
  border-radius: 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
}

.role-card:hover {
  border-color: var(--gem-navy);
  background: #f8fafc;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(30, 58, 95, 0.1);
}

.role-card.selected {
  border-color: var(--gem-navy);
  background: #eef4fb;
  box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.15);
}

.role-card i {
  font-size: 1.8rem;
  color: var(--gem-navy);
  display: block;
  margin-bottom: 8px;
}

.role-card .role-name {
  font-size: 0.88rem;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 2px;
}

.role-card .role-desc {
  font-size: 0.72rem;
  color: var(--gem-gray);
}

/* ═══ Form ═══ */
.form-section {
  display: none;
  margin-top: 20px;
}

.form-section.active {
  display: block;
}

.form-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: #475569;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  display: block;
}

.form-control {
  width: 100%;
  padding: 12px 14px;
  font-size: 0.95rem;
  font-family: inherit;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  transition: all 0.15s;
  background: #fff;
  color: #0f172a;
}

.form-control:focus {
  outline: none;
  border-color: var(--gem-navy);
  box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
}

.form-control.is-invalid {
  border-color: var(--gem-red);
  background: #fef2f2;
}

.form-group {
  margin-bottom: 16px;
}

.password-wrapper {
  position: relative;
}

.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--gem-gray);
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
}

.password-toggle:hover {
  color: var(--gem-navy);
}

/* ═══ Button ═══ */
.btn-login {
  width: 100%;
  padding: 14px;
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--gem-navy) 0%, var(--gem-navy-light) 100%);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-login:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(30, 58, 95, 0.25);
}

.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ═══ Error Message ═══ */
.error-message {
  padding: 12px 14px;
  background: #fef2f2;
  border: 1.5px solid #fecaca;
  border-radius: 10px;
  color: #991b1b;
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
  align-items: flex-start;
  gap: 8px;
}

.error-message.show {
  display: flex;
}

.error-message i {
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ═══ Back Button ═══ */
.btn-back {
  width: 100%;
  padding: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--gem-gray);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: inherit;
  margin-top: 12px;
  display: none;
}

.btn-back.show {
  display: block;
}

.btn-back:hover {
  color: var(--gem-navy);
}

/* ═══ Footer ═══ */
.login-footer {
  padding: 16px 28px 24px;
  text-align: center;
  border-top: 1px solid #f1f5f9;
  font-size: 0.75rem;
  color: var(--gem-gray);
}

/* ═══ Mobile ═══ */
@media (max-width: 480px) {
  .login-body { padding: 20px; }
  .role-card { padding: 16px 12px; }
  .role-card i { font-size: 1.5rem; }
  .role-card .role-name { font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <img src="../gemcor-logo.png" alt="GEMCOR" class="login-logo" onerror="this.style.display='none'">
      <div class="login-title">GEMCOR ERP</div>
      <div class="login-subtitle">Warehouse Management System</div>
    </div>
    
    <!-- Body -->
    <div class="login-body">
      
      <!-- Error Message -->
      <div class="error-message" id="errorMessage">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <div id="errorText"></div>
      </div>
      
      <!-- STEP 1: Role Selection -->
      <div id="roleStep">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:0.85rem;color:#64748b;font-weight:500;">Select your role to continue</div>
        </div>
        
        <div class="role-selection">
          <div class="role-card" data-role="warehouse" onclick="selectRole('warehouse')">
            <i class="bi bi-shield-check"></i>
            <div class="role-name">Warehouse</div>
            <div class="role-desc">Process & manage</div>
          </div>
          <div class="role-card" data-role="production" onclick="selectRole('production')">
            <i class="bi bi-person-badge"></i>
            <div class="role-name">Production</div>
            <div class="role-desc">Create requests</div>
          </div>
        </div>
      </div>
      
      <!-- STEP 2: Login Form -->
      <div id="loginStep" class="form-section">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:0.72rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;" id="loginRoleLabel">
            Warehouse Login
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" 
                 id="loginUsername" 
                 class="form-control" 
                 placeholder="Enter username"
                 autocomplete="username"
                 autofocus>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" 
                   id="loginPassword" 
                   class="form-control" 
                   placeholder="Enter password"
                   autocomplete="current-password"
                   onkeypress="if(event.key==='Enter')loginUser()">
            <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1">
              <i class="bi bi-eye" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>
        
        <button class="btn-login" id="btnLogin" onclick="loginUser()">
          <i class="bi bi-box-arrow-in-right"></i>
          <span id="btnLoginText">Sign In</span>
        </button>
        
        <button class="btn-back" id="btnBack" onclick="backToRole()">
          <i class="bi bi-arrow-left me-1"></i>Back to Role Selection
        </button>
      </div>
      
    </div>
    
    <!-- Footer -->
    <div class="login-footer">
      <div>© 2026 GEMCOR ERP — Greenmetal Electric Manufacturing Corp.</div>
    </div>
    
  </div>
</div>

<!-- Scripts -->
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="erp-config.js"></script>
<script defer src="js/auth.js"></script>

</body>
</html>
