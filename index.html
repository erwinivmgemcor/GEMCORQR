<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting — GEMCOR ERP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3a5f 0%, #152a47 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}

.redirect-container {
  text-align: center;
  max-width: 500px;
  padding: 40px 32px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.logo {
  height: 60px;
  background: #fff;
  padding: 8px 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  display: inline-block;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255, 255, 255, 0.2);
  border-top-color: #10b981;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 24px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.title {
  font-size: 1.4rem;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}

.subtitle {
  font-size: 0.9rem;
  opacity: 0.8;
  line-height: 1.6;
  margin-bottom: 24px;
}

.info-box {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: left;
}

.info-box strong {
  color: #6ee7b7;
  display: block;
  margin-bottom: 6px;
  font-size: 0.85rem;
}

.info-box p {
  font-size: 0.82rem;
  opacity: 0.9;
  line-height: 1.5;
}

.btn {
  display: inline-block;
  padding: 14px 32px;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #fff;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.95rem;
  transition: all 0.15s;
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
  color: #fff;
}

.countdown {
  margin-top: 16px;
  font-size: 0.8rem;
  opacity: 0.7;
}

.countdown strong {
  color: #fbbf24;
  font-size: 1rem;
}
</style>

<script>
// ═══════════════════════════════════════════════════════════
// AUTO-REDIRECT LEGACY → NEW ERP
// ═══════════════════════════════════════════════════════════
(function() {
  var redirectUrl = 'GEMCORERP/login.html';
  var countdown = 3;
  
  // Update countdown display
  function updateCountdown() {
    var el = document.getElementById('countdownValue');
    if (el) el.textContent = countdown;
    
    if (countdown <= 0) {
      window.location.replace(redirectUrl);
      return;
    }
    
    countdown--;
    setTimeout(updateCountdown, 1000);
  }
  
  // Start countdown
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(updateCountdown, 1000);
  });
  
  // Also support direct redirect (for bookmark use)
  setTimeout(function() {
    window.location.replace(redirectUrl);
  }, 3500);
})();
</script>
</head>
<body>

<div class="redirect-container">
  <img src="gemcor-logo.png" alt="GEMCOR" class="logo" onerror="this.style.display='none'">
  
  <div class="spinner"></div>
  
  <div class="title">System Upgraded!</div>
  <div class="subtitle">
    We've moved to a new and improved ERP system.
  </div>
  
  <div class="info-box">
    <strong>ⓘ What's New</strong>
    <p>
      • Faster performance (0.2s vs 15s)<br>
      • Modern dashboard & analytics<br>
      • Better mobile experience
    </p>
  </div>
  
  <a href="GEMCORERP/login.html" class="btn">
    Go to GEMCOR ERP →
  </a>
  
  <div class="countdown">
    Auto-redirect in <strong id="countdownValue">3</strong> seconds...
  </div>
</div>

</body>
</html>
