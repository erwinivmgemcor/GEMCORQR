<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IVM WAREHOUSE QR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --primary:#0d6efd; --success:#198754; --warning:#ffc107; --danger:#dc3545; --scanner-bg:#1a1a2e; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; touch-action:manipulation; padding-bottom:20px; }
    .scanner-container { position:relative; width:100%; max-width:400px; margin:0 auto; border-radius:12px; overflow:hidden; background:var(--scanner-bg); }
    #reader { width:100% !important; border:none !important; }
    #reader video { border-radius:12px; }
    .scanner-overlay { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
    .scanner-frame { width:220px; height:220px; border:2px solid rgba(255,255,255,0.8); border-radius:12px; position:relative; }
    .scanner-frame::before,.scanner-frame::after { content:''; position:absolute; width:30px; height:30px; border-color:#00ff88; border-style:solid; }
    .scanner-frame::before { top:-2px; left:-2px; border-width:4px 0 0 4px; }
    .scanner-frame::after { bottom:-2px; right:-2px; border-width:0 4px 4px 0; }
    .scan-line { position:absolute; top:0; left:0; right:0; height:2px; background:#00ff88; box-shadow:0 0 8px #00ff88; animation:scan 2s linear infinite; }
    @keyframes scan { 0%{top:0} 50%{top:100%} 100%{top:0} }
    .status-badge { font-size:.75rem; padding:.25rem .5rem; border-radius:.375rem; font-weight:600; }
    .status-served { background:#d1fae5; color:#065f46; }
    .status-partial { background:#fef3c7; color:#92400e; }
    .status-pending { background:#fee2e2; color:#991b1b; }
    .item-row { transition:all .2s; border-left:4px solid transparent; }
    .item-row.verified { border-left-color:var(--success); background:#f0fdf4; }
    .item-row:hover { background:#f8f9fa; }
    .cam-controls { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:10; }
    .cam-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(0,0,0,0.6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
    .cam-btn.active { background:rgba(255,193,7,0.9); color:#000; }
    .wifi-icon { font-size:1.2rem; }
    .wifi-online { color:var(--success); }
    .wifi-offline { color:var(--danger); }
    .module-btn { font-size:.85rem; padding:.5rem .75rem; }
    .module-btn.active { background:var(--primary); color:#fff; }
    .doc-search { margin-bottom:.5rem; }
    #requestItemDropdown { max-height:200px; overflow-y:auto; }
    .dropdown-item { cursor:pointer; }
    .dropdown-item:hover { background:#e9ecef; }
    .toast-container { z-index:1060; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h5"><i class="bi bi-box-seam me-2"></i>IVM WAREHOUSE QR</span>
    <div class="d-flex align-items-center gap-2">
      <span id="moduleLabel" class="badge bg-light text-dark">MRIF</span>
      <i id="wifiIcon" class="bi bi-wifi wifi-icon wifi-online"></i>
      <button class="btn btn-sm btn-outline-light" onclick="openSettings()"><i class="bi bi-gear-fill"></i></button>
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">

  <!-- Module Buttons -->
  <div class="row g-2 mb-3">
    <div class="col-3"><button class="btn btn-outline-primary w-100 module-btn" onclick="selectModule('MRR')"><i class="bi bi-box-arrow-in-down"></i><br>Receiving</button></div>
    <div class="col-3"><button class="btn btn-outline-primary w-100 module-btn active" onclick="selectModule('MRIF')"><i class="bi bi-box-arrow-up"></i><br>Releasing</button></div>
    <div class="col-3"><button class="btn btn-outline-primary w-100 module-btn" onclick="selectModule('MRS')"><i class="bi bi-arrow-counterclockwise"></i><br>Returns</button></div>
    <div class="col-3"><button class="btn btn-outline-success w-100 module-btn" onclick="openNewRequest()"><i class="bi bi-plus-lg"></i><br>New Request</button></div>
  </div>

  <!-- Document Picker -->
  <div id="docPickerSection">
    <div class="card">
      <div class="card-header bg-light"><strong><i class="bi bi-file-earmark-text me-2"></i>Select Document</strong></div>
      <div class="card-body">
        <input type="text" id="docSearch" class="form-control doc-search" placeholder="🔍 Search document..." oninput="filterDocs()">
        <select id="docSelect" class="form-select" onchange="onDocSelect(this.value)">
          <option value="">-- Select Document --</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Active Transaction -->
  <div id="activeTransactionSection" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="changeDocument()"><i class="bi bi-arrow-left"></i> Change Document</button>
      <span id="docTitle" class="badge bg-primary"></span>
    </div>

    <!-- Scanner -->
    <div class="scanner-container mb-3">
      <div id="reader"></div>
      <div class="scanner-overlay"><div class="scanner-frame"><div class="scan-line"></div></div></div>
      <div class="cam-controls">
        <button id="torchBtn" class="cam-btn d-none" onclick="toggleTorch()" title="Flashlight"><i class="bi bi-lightning-charge-fill"></i></button>
        <button id="switchCamBtn" class="cam-btn" onclick="switchCamera()" title="Switch Camera"><i class="bi bi-arrow-repeat"></i></button>
      </div>
    </div>

    <!-- Manual Input -->
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
      <input type="text" id="manualInput" class="form-control" placeholder="Or type Inventory ID manually..." onkeypress="if(event.key==='Enter')manualVerify()">
      <button class="btn btn-primary" onclick="manualVerify()">Verify</button>
    </div>

    <!-- Alerts -->
    <div id="mismatchAlert" class="alert alert-danger d-none py-2"><i class="bi bi-exclamation-triangle-fill me-2"></i><span id="mismatchText"></span></div>
    <div id="exceedErrorAlert" class="alert alert-danger d-none py-2"><i class="bi bi-exclamation-triangle-fill me-2"></i><span id="exceedText"></span></div>

    <!-- Item Checklist -->
    <div class="card">
      <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <strong><i class="bi bi-list-check me-2"></i>Item Checklist</strong>
        <span id="verifyCount" class="badge bg-success">0/0 Verified</span>
      </div>
      <div class="card-body p-0">
        <div class="p-2 border-bottom">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="itemFilter" class="form-control" placeholder="Filter items by code or description..." oninput="filterItems()">
            <button class="btn btn-outline-secondary" onclick="document.getElementById('itemFilter').value='';filterItems()">Clear</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0">
            <thead class="table-light"><tr>
              <th>Item Code</th>
              <th id="headerExpected">Req. Qty</th>
              <th id="headerInput">Issued Qty</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="itemsTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <button id="submitBtn" class="btn btn-success w-100 mt-3 py-3" onclick="onSubmit()">
      <i class="bi bi-check-circle me-2"></i><span id="submitBtnText">Confirm & Submit</span>
    </button>
  </div>
</div>

<!-- Qty Modal -->
<div class="modal fade" id="qtyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Enter Quantity</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label"><strong>Item:</strong> <span id="modalItemCode"></span></label>
          <div class="text-muted small" id="modalItemDesc"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" id="modalExpectedLabel">Requested Qty</label>
          <input type="number" id="modalExpectedQty" class="form-control" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label" id="modalInputLabel">Enter Issued Qty</label>
          <input type="number" id="modalInputQty" class="form-control" min="0" step="1" oninput="onQtyInput()">
          <div id="modalHint" class="form-text"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="confirmQty()">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="bi bi-gear me-2"></i>Settings</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <button class="btn btn-outline-primary w-100 mb-3" onclick="syncModuleLinks()">
          <span id="syncBtnText">🔄 Sync IDs from Master Sheet</span>
        </button>
        <div class="mb-3">
          <label class="form-label">MRR Sheet URL / ID</label>
          <input type="text" id="sheetId_MRR" class="form-control" placeholder="Paste MRR Sheet URL or ID">
        </div>
        <div class="mb-3">
          <label class="form-label">MRIF Sheet URL / ID</label>
          <input type="text" id="sheetId_MRIF" class="form-control" placeholder="Paste MRIF Sheet URL or ID">
        </div>
        <div class="mb-3">
          <label class="form-label">MRS Sheet URL / ID</label>
          <input type="text" id="sheetId_MRS" class="form-control" placeholder="Paste MRS Sheet URL or ID">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-body py-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
        <h4 class="mt-3">Transaction Submitted!</h4>
        <p class="text-muted">The document has been updated successfully.</p>
      </div>
    </div>
  </div>
</div>

<!-- New Request Modal -->
<div class="modal fade" id="newRequestModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>New Request</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Document Type</label>
            <select id="reqDocType" class="form-select"><option value="MRIF">MRIF (Releasing)</option><option value="MRS">MRS (Returns)</option></select>
          </div>
          <div class="col-6">
            <label class="form-label">Department</label>
            <input type="text" id="reqDepartment" class="form-control" placeholder="e.g. Production A">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Requestor Name</label>
          <input type="text" id="reqRequestor" class="form-control" placeholder="Full name">
        </div>
        <hr>
        <div id="requestItemsContainer"></div>
        <button class="btn btn-outline-primary w-100" onclick="addRequestItemRow()"><i class="bi bi-plus-lg"></i> Add Item</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="submitNewRequest()">Submit Request</button>
      </div>
    </div>
  </div>
</div>

<!-- Request Success Modal -->
<div class="modal fade" id="requestSuccessModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-body py-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size:3rem;"></i>
        <h4 class="mt-3">Request Created!</h4>
        <div class="my-2">
          <span class="badge bg-secondary">Ticket: <span id="requestTicketNo"></span></span><br>
          <span class="badge bg-primary mt-1">Doc: <span id="requestDocNo"></span></span>
        </div>
        <div class="my-3">
          <img id="requestQrImg" src="" alt="QR Code" style="max-width:280px;width:100%;">
          <div id="qrFallback" class="d-none alert alert-warning mt-2"></div>
        </div>
        <p class="text-muted small">Show this QR code to the warehouse team.</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Done</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert">
    <div class="toast-header"><strong class="me-auto" id="toastTitle">Notification</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const API_URL = 'https://script.google.com/macros/s/AKfycbzGXpYbQXfcKHxMpVGJ7NfAHKwZOAY6jWMqzhsmljQAsPz2EG6fVBnzEgc--SKTJvKk/exec';

// ==================== STATE ====================
const state = {
  currentModule: 'MRIF',
  currentDoc: null,
  items: [],
  html5QrCode: null,
  currentCamera: 'environment',
  torchOn: false,
  cameras: [],
  requestInventoryList: [],
  errorTimer: null
};

const qtyModal = new bootstrap.Modal(document.getElementById('qtyModal'));
const successModal = new bootstrap.Modal(document.getElementById('successModal'));
const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
const newRequestModal = new bootstrap.Modal(document.getElementById('newRequestModal'));
const requestSuccessModal = new bootstrap.Modal(document.getElementById('requestSuccessModal'));

// ==================== AUDIO ====================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSuccessBeep() {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    if (navigator.vibrate) navigator.vibrate(100);
  } catch(e) {}
}
function playErrorBuzz() {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    if (navigator.vibrate) navigator.vibrate([100,50,100]);
  } catch(e) {}
}

// ==================== NETWORK ====================
function updateWifiIcon(online) {
  const icon = document.getElementById('wifiIcon');
  if (online) { icon.className = 'bi bi-wifi wifi-icon wifi-online'; icon.title = 'Online'; }
  else { icon.className = 'bi bi-wifi-off wifi-icon wifi-offline'; icon.title = 'Offline'; }
}
window.addEventListener('online', () => updateWifiIcon(true));
window.addEventListener('offline', () => updateWifiIcon(false));
updateWifiIcon(navigator.onLine);

// ==================== SETTINGS ====================
function openSettings() {
  loadSettingsToUI();
  settingsModal.show();
}
function loadSettingsToUI() {
  const mrr = document.getElementById('sheetId_MRR');
  const mrif = document.getElementById('sheetId_MRIF');
  const mrs = document.getElementById('sheetId_MRS');
  if (mrr) mrr.value = localStorage.getItem('sheetId_MRR') || '';
  if (mrif) mrif.value = localStorage.getItem('sheetId_MRIF') || '';
  if (mrs) mrs.value = localStorage.getItem('sheetId_MRS') || '';
}
function saveSettings() {
  const mrr = document.getElementById('sheetId_MRR').value.trim();
  const mrif = document.getElementById('sheetId_MRIF').value.trim();
  const mrs = document.getElementById('sheetId_MRS').value.trim();
  if (mrr) localStorage.setItem('sheetId_MRR', extractSheetId(mrr));
  if (mrif) localStorage.setItem('sheetId_MRIF', extractSheetId(mrif));
  if (mrs) localStorage.setItem('sheetId_MRS', extractSheetId(mrs));
  showToast('Settings saved!', 'success');
  settingsModal.hide();
  if (state.currentModule) selectModule(state.currentModule);
}
function extractSheetId(url) {
  if (!url) return '';
  if (url.length === 44 && !url.includes('/')) return url;
  const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : url;
}
function getCleanSheetId() {
  const key = 'sheetId_' + state.currentModule;
  const val = localStorage.getItem(key);
  return val ? extractSheetId(val) : '';
}

// ==================== SYNC ====================
async function syncModuleLinks() {
  const btn = document.getElementById('syncBtnText');
  const original = btn.innerHTML;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Syncing...';
  try {
    const url = API_URL + '?action=getModuleLinks&_t=' + Date.now();
    const res = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { throw new Error('Invalid response'); }
    if (data && data.success && data.links) {
      const { MRIF, MRR, MRS } = data.links;
      if (MRIF) { localStorage.setItem('sheetId_MRIF', MRIF); document.getElementById('sheetId_MRIF').value = MRIF; }
      if (MRR) { localStorage.setItem('sheetId_MRR', MRR); document.getElementById('sheetId_MRR').value = MRR; }
      if (MRS) { localStorage.setItem('sheetId_MRS', MRS); document.getElementById('sheetId_MRS').value = MRS; }
      alert('Module IDs synced!\nMRIF: ' + (MRIF?'OK':'Missing') + '\nMRR: ' + (MRR?'OK':'Missing') + '\nMRS: ' + (MRS?'OK':'Missing'));
      if (state.currentModule) selectModule(state.currentModule);
    } else {
      alert('Sync failed: ' + (data.error || 'No links found'));
    }
  } catch(err) {
    alert('Sync error: ' + err.message);
  } finally {
    btn.innerHTML = original;
  }
}

// ==================== MODULE SELECT ====================
function selectModule(mod) {
  state.currentModule = mod;
  document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
  event.target.closest('.module-btn').classList.add('active');
  document.getElementById('moduleLabel').textContent = mod;
  updateLabels();
  changeDocument();
  fetchPendingDocs();
}
function updateLabels() {
  const isMRR = state.currentModule === 'MRR';
  const isMRS = state.currentModule === 'MRS';
  document.getElementById('headerExpected').textContent = isMRR ? 'REC. QTY' : (isMRS ? 'QTY RETURNED' : 'Req. Qty');
  document.getElementById('headerInput').textContent = isMRR ? 'ATL QTY' : (isMRS ? 'ATL QTY (Actual)' : 'Issued Qty');
}

// ==================== DOCUMENTS ====================
async function fetchPendingDocs() {
  const sheetId = getCleanSheetId();
  if (!sheetId) { showToast('No Sheet ID configured for ' + state.currentModule, 'warning'); return; }
  try {
    const url = API_URL + '?action=getPendingDocs&docType=' + state.currentModule + '&sheetId=' + sheetId + '&_t=' + Date.now();
    const res = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = []; }
    const docs = Array.isArray(data) ? data : (data.docs || data.documents || []);
    populateDocSelect(docs);
  } catch(err) {
    showToast('Failed to load documents', 'danger');
  }
}
function populateDocSelect(docs) {
  const sel = document.getElementById('docSelect');
  sel.innerHTML = '<option value="">-- Select Document --</option>';
  state.docList = docs;
  docs.forEach(d => {
    const val = typeof d === 'string' ? d : (d.docNo || d.name || d);
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    sel.appendChild(opt);
  });
}
function filterDocs() {
  const term = document.getElementById('docSearch').value.toLowerCase();
  const sel = document.getElementById('docSelect');
  sel.innerHTML = '<option value="">-- Select Document --</option>';
  if (!state.docList) return;
  state.docList.forEach(d => {
    const val = typeof d === 'string' ? d : (d.docNo || d.name || d);
    if (val.toLowerCase().includes(term)) {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = val;
      sel.appendChild(opt);
    }
  });
}
function onDocSelect(docNo) {
  if (!docNo) { hideScannerSection(); return; }
  clearErrorAlert();
  resetDocumentState();
  state.currentDoc = docNo;
  document.getElementById('docPickerSection').classList.add('d-none');
  document.getElementById('activeTransactionSection').classList.remove('d-none');
  document.getElementById('docTitle').textContent = docNo;
  fetchDocItems(docNo, state.currentModule);
}
function changeDocument() {
  state.currentDoc = null;
  resetDocumentState();
  stopScanner();
  document.getElementById('docPickerSection').classList.remove('d-none');
  document.getElementById('activeTransactionSection').classList.add('d-none');
  document.getElementById('docSelect').value = '';
}
function hideScannerSection() {
  document.getElementById('activeTransactionSection').classList.add('d-none');
}
function resetDocumentState() {
  state.items = [];
  renderItems();
  clearErrorAlert();
}

// ==================== ITEMS ====================
async function fetchDocItems(docNo, docType) {
  const sheetId = getCleanSheetId();
  if (!sheetId) return;
  try {
    const url = API_URL + '?action=getDocItems&docNo=' + encodeURIComponent(docNo) + '&docType=' + docType + '&sheetId=' + sheetId + '&_t=' + Date.now();
    const res = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = []; }
    const items = Array.isArray(data) ? data : (data.items || []);
    state.items = items.map((it, idx) => ({
      inventoryId: it.inventoryId || it.code || it.itemCode || '',
      description: it.description || it.desc || '',
      qty: Number(it.qty || it.requestedQty || it.expectedQty || 0),
      issuedQty: Number(it.issuedQty || it.actualQty || 0),
      rowIndex: it.rowIndex || (idx + 12),
      verified: false
    }));
    renderItems();
    startScanner();
  } catch(err) {
    showToast('Failed to load items', 'danger');
  }
}
function renderItems() {
  const tbody = document.getElementById('itemsTable');
  tbody.innerHTML = '';
  let verified = 0;
  state.items.forEach((item, idx) => {
    if (item.verified) verified++;
    const tr = document.createElement('tr');
    tr.className = 'item-row' + (item.verified ? ' verified' : '');
    tr.innerHTML = '<td><div class="fw-bold small">' + item.inventoryId + '</div><div class="text-muted small">' + item.description + '</div></td>' +
      '<td class="text-center">' + item.qty + '</td>' +
      '<td class="text-center fw-bold">' + (item.verified ? item.issuedQty : '-') + '</td>' +
      '<td>' + getStatusBadge(item) + '</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('verifyCount').textContent = verified + '/' + state.items.length + ' Verified';
  updateSubmitButton(verified, state.items.length);
}
function getStatusBadge(item) {
  if (!item.verified) return '<span class="status-badge status-pending">PENDING</span>';
  if (state.currentModule === 'MRR') {
    return item.issuedQty >= item.qty ? '<span class="status-badge status-served">COMPLETE</span>' : '<span class="status-badge status-partial">PARTIAL</span>';
  }
  return item.issuedQty >= item.qty ? '<span class="status-badge status-served">SERVED</span>' : '<span class="status-badge status-partial">PARTIAL</span>';
}
function filterItems() {
  const term = document.getElementById('itemFilter').value.toLowerCase();
  document.querySelectorAll('#itemsTable tr').forEach(tr => {
    const text = tr.textContent.toLowerCase();
    tr.style.display = text.includes(term) ? '' : 'none';
  });
}
function updateSubmitButton(verified, total) {
  const btn = document.getElementById('submitBtn');
  const txt = document.getElementById('submitBtnText');
  if (total === 0) { btn.disabled = true; txt.textContent = 'No Items'; return; }
  btn.disabled = false;
  if (verified === total) {
    btn.className = 'btn btn-success w-100 mt-3 py-3';
    txt.textContent = 'Confirm & Submit';
  } else {
    btn.className = 'btn btn-warning w-100 mt-3 py-3';
    txt.textContent = 'Submit Partial (' + verified + '/' + total + ')';
  }
}

// ==================== SCANNER ====================
function startScanner() {
  if (state.html5QrCode) { state.html5QrCode.stop().catch(()=>{}); }
  state.html5QrCode = new Html5Qrcode('reader');
  Html5Qrcode.getCameras().then(cameras => {
    state.cameras = cameras;
    if (cameras.length === 0) { showToast('No cameras found', 'warning'); return; }
    const camId = state.currentCamera === 'environment' ? cameras.find(c=>c.label.toLowerCase().includes('back'))?.id || cameras[0].id : cameras.find(c=>c.label.toLowerCase().includes('front'))?.id || cameras[0].id;
    state.html5QrCode.start(camId, { fps:10, qrbox:{width:200,height:200} }, onScanSuccess, ()=>{}).then(()=>{
      document.getElementById('torchBtn').classList.remove('d-none');
    }).catch(err => showToast('Camera error: ' + err, 'danger'));
  }).catch(err => showToast('Camera access denied', 'danger'));
}
function stopScanner() {
  if (state.html5QrCode) { state.html5QrCode.stop().catch(()=>{}); state.html5QrCode = null; }
}
function onScanSuccess(decodedText) {
  clearErrorAlert();
  const item = state.items.find(i => i.inventoryId.toLowerCase() === decodedText.toLowerCase());
  if (!item) {
    playErrorBuzz();
    showMismatchAlert(decodedText);
    return;
  }
  playSuccessBeep();
  openQtyModal(item);
}
function manualVerify() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  document.getElementById('manualInput').value = '';
  onScanSuccess(val);
}
function toggleTorch() {
  const video = document.querySelector('#reader video');
  if (!video || !video.srcObject) return;
  const track = video.srcObject.getVideoTracks()[0];
  if (!track) return;
  const caps = track.getCapabilities();
  if (!caps.torch) { showToast('Flashlight not supported', 'warning'); return; }
  state.torchOn = !state.torchOn;
  track.applyConstraints({ advanced:[{torch:state.torchOn}] }).then(()=>{
    document.getElementById('torchBtn').classList.toggle('active', state.torchOn);
    showToast(state.torchOn ? 'Flashlight ON' : 'Flashlight OFF', 'info');
  }).catch(()=>showToast('Torch failed', 'warning'));
}
function switchCamera() {
  state.currentCamera = state.currentCamera === 'environment' ? 'user' : 'environment';
  startScanner();
}

// ==================== QTY MODAL ====================
let currentModalItem = null;
function openQtyModal(item) {
  currentModalItem = item;
  const isMRR = state.currentModule === 'MRR';
  const isMRS = state.currentModule === 'MRS';
  document.getElementById('modalItemCode').textContent = item.inventoryId;
  document.getElementById('modalItemDesc').textContent = item.description;
  document.getElementById('modalExpectedLabel').textContent = isMRR ? 'REC. QTY' : (isMRS ? 'QTY RETURNED' : 'Requested Qty');
  document.getElementById('modalExpectedQty').value = item.qty;
  document.getElementById('modalInputLabel').textContent = isMRR ? 'ATL QTY (Received)' : (isMRS ? 'ATL QTY (Actual Returned)' : 'Enter Issued Qty');
  document.getElementById('modalInputQty').value = item.qty;
  document.getElementById('modalHint').textContent = isMRR ? 'MRR Mode: You may receive any quantity.' : (isMRS ? 'MRS Mode: Returned qty cannot exceed expected.' : 'MRIF Mode: Issued qty cannot exceed requested.');
  document.getElementById('modalInputQty').classList.remove('is-invalid');
  qtyModal.show();
}
function onQtyInput() {
  clearErrorAlert();
  document.getElementById('modalInputQty').classList.remove('is-invalid');
}
function confirmQty() {
  if (!currentModalItem) return;
  const input = document.getElementById('modalInputQty');
  const qtyVal = parseInt(input.value, 10);
  if (isNaN(qtyVal) || qtyVal < 0) {
    input.classList.add('is-invalid');
    playErrorBuzz();
    return;
  }
  const isMRR = state.currentModule === 'MRR';
  if (!isMRR && qtyVal > currentModalItem.qty) {
    const max = currentModalItem.qty;
    const msg = state.currentModule === 'MRS'
      ? 'Returned Qty cannot exceed Expected Qty (Max: ' + max + ')'
      : 'Issued Qty cannot exceed Requested Qty (Max: ' + max + ')';
    showExceedError(msg);
    input.value = max;
    input.classList.add('is-invalid');
    playErrorBuzz();
    return;
  }
  currentModalItem.issuedQty = qtyVal;
  currentModalItem.verified = true;
  renderItems();
  qtyModal.hide();
  playSuccessBeep();
}
function showMismatchAlert(code) {
  const alert = document.getElementById('mismatchAlert');
  document.getElementById('mismatchText').textContent = 'Item "' + code + '" not found in this document.';
  alert.classList.remove('d-none');
  clearTimeout(state.errorTimer);
  state.errorTimer = setTimeout(() => clearErrorAlert(), 4000);
}
function showExceedError(msg) {
  const alert = document.getElementById('exceedErrorAlert');
  document.getElementById('exceedText').textContent = '❌ Error: ' + msg;
  alert.classList.remove('d-none');
  clearTimeout(state.errorTimer);
  state.errorTimer = setTimeout(() => clearErrorAlert(), 4000);
}
function clearErrorAlert() {
  const a1 = document.getElementById('mismatchAlert');
  const a2 = document.getElementById('exceedErrorAlert');
  if (a1) a1.classList.add('d-none');
  if (a2) a2.classList.add('d-none');
}

// ==================== SUBMIT ====================
async function onSubmit() {
  const verifiedItems = state.items.filter(i => i.verified);
  const total = state.items.length;
  const verified = verifiedItems.length;
  
  if (verified < total) {
    if (!confirm('You have ' + (total - verified) + ' unverified item(s). Submit partial transaction now?\nOnly scanned/entered items will be sent.')) {
      return;
    }
  }
  
  const payload = {
    docNo: state.currentDoc,
    docType: state.currentModule,
    sheetId: getCleanSheetId(),
    scannedItems: verifiedItems.map(i => ({
      inventoryId: i.inventoryId,
      description: i.description,
      qty: i.qty,
      issuedQty: i.issuedQty,
      rowIndex: i.rowIndex,
      scannedAt: new Date().toISOString()
    }))
  };
  
  console.log('Submitting:', payload);
  
  try {
    const result = await submitTransaction(payload);
    console.log('Result:', result);
    if (result && (result.success === true || result.message)) {
      successModal.show();
      setTimeout(() => location.reload(), 2000);
    } else {
      showToast('❌ ' + (result.error || 'Submission failed'), 'danger');
    }
  } catch(err) {
    showToast('❌ ' + err.message, 'danger');
    console.error(err);
  }
}

async function submitTransaction(payload) {
  // Try POST first
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow'
    });
    const text = await res.text();
    console.log('POST raw:', text.substring(0,500));
    return parseResponse(text);
  } catch(postErr) {
    console.warn('POST failed, trying GET fallback:', postErr);
    // GET fallback (CORS-safe)
    try {
      const payloadStr = encodeURIComponent(JSON.stringify(payload));
      const url = API_URL + '?action=submitTransaction&payload=' + payloadStr + '&_t=' + Date.now();
      const res = await fetch(url, { redirect: 'follow' });
      const text = await res.text();
      console.log('GET raw:', text.substring(0,500));
      return parseResponse(text);
    } catch(getErr) {
      throw new Error('Both POST and GET failed: ' + getErr.message);
    }
  }
}

function parseResponse(text) {
  try {
    return JSON.parse(text);
  } catch(e) {
    // Try to extract JSON from HTML wrapper
    const m = text.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
    throw new Error('Non-JSON response: ' + text.substring(0,200));
  }
}

// ==================== NEW REQUEST ====================
function openNewRequest() {
  document.getElementById('requestItemsContainer').innerHTML = '';
  addRequestItemRow();
  loadRequestInventory();
  newRequestModal.show();
}
async function loadRequestInventory() {
  try {
    const url = API_URL + '?action=getInventoryList&_t=' + Date.now();
    const res = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = {}; }
    const inv = data.inventory || data.items || [];
    state.requestInventoryList = inv;
    console.log('Inventory loaded:', inv.length);
  } catch(err) {
    console.error('Inventory load error:', err);
    state.requestInventoryList = [];
  }
}
function addRequestItemRow() {
  const container = document.getElementById('requestItemsContainer');
  const idx = container.children.length;
  const div = document.createElement('div');
  div.className = 'row g-2 mb-2 align-items-end';
  div.innerHTML = '<div class="col-5"><label class="form-label small">Item</label><input type="text" class="form-control req-item-search" placeholder="Type to search..." oninput="filterRequestItems(this,'+idx+')" onfocus="filterRequestItems(this,'+idx+')"><div class="list-group position-absolute z-3 d-none req-dropdown" style="max-height:150px;overflow-y:auto;" id="reqDropdown'+idx+'"></div><input type="hidden" class="req-item-code" id="reqCode'+idx+'"><input type="hidden" class="req-item-desc" id="reqDesc'+idx+'"></div>' +
    '<div class="col-3"><label class="form-label small">Qty</label><input type="number" class="form-control req-qty" min="1" value="1"></div>' +
    '<div class="col-3"><label class="form-label small">Unit</label><input type="text" class="form-control req-unit" value="PCS" readonly></div>' +
    '<div class="col-1"><button class="btn btn-outline-danger btn-sm" onclick="this.closest(\'.row\').remove()"><i class="bi bi-trash"></i></button></div>';
  container.appendChild(div);
}
function filterRequestItems(input, idx) {
  const term = input.value.toLowerCase();
  const dropdown = document.getElementById('reqDropdown'+idx);
  dropdown.innerHTML = '';
  if (!term) { dropdown.classList.add('d-none'); return; }
  const matches = state.requestInventoryList.filter(it => {
    const code = (it.code || it.inventoryId || '').toLowerCase();
    const desc = (it.description || '').toLowerCase();
    return code.includes(term) || desc.includes(term);
  }).slice(0, 10);
  if (matches.length === 0) {
    dropdown.innerHTML = '<div class="list-group-item text-muted">No matches</div>';
  } else {
    matches.forEach(it => {
      const code = it.code || it.inventoryId || '';
      const desc = it.description || '';
      const el = document.createElement('div');
      el.className = 'list-group-item list-group-item-action';
      el.innerHTML = '<div class="fw-bold small">' + code + '</div><div class="small text-muted">' + desc + '</div>';
      el.onclick = () => {
        input.value = code + ' - ' + desc;
        document.getElementById('reqCode'+idx).value = code;
        document.getElementById('reqDesc'+idx).value = desc;
        dropdown.classList.add('d-none');
      };
      dropdown.appendChild(el);
    });
  }
  dropdown.classList.remove('d-none');
}
async function submitNewRequest() {
  const docType = document.getElementById('reqDocType').value;
  const requestor = document.getElementById('reqRequestor').value.trim();
  const department = document.getElementById('reqDepartment').value.trim();
  if (!requestor) { alert('Enter requestor name'); return; }
  
  const items = [];
  document.querySelectorAll('#requestItemsContainer .row').forEach(row => {
    const code = row.querySelector('.req-item-code').value;
    const desc = row.querySelector('.req-item-desc').value;
    const qty = parseInt(row.querySelector('.req-qty').value, 10);
    if (code && qty > 0) items.push({ inventoryId: code, description: desc, qty: qty });
  });
  if (items.length === 0) { alert('Add at least one item'); return; }
  
  const payload = {
    action: 'createRequest',
    docType: docType,
    requestor: requestor,
    department: department,
    items: items,
    timestamp: new Date().toISOString()
  };
  
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow'
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { throw new Error('Invalid response'); }
    if (data && data.success) {
      newRequestModal.hide();
      showRequestQr(data.ticketNo || 'N/A', data.docNo || 'N/A');
    } else {
      alert('Failed: ' + (data.error || 'Unknown error'));
    }
  } catch(err) {
    alert('Error: ' + err.message);
  }
}
function showRequestQr(ticketNo, docNo) {
  document.getElementById('requestTicketNo').textContent = ticketNo;
  document.getElementById('requestDocNo').textContent = docNo;
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(docNo);
  const img = document.getElementById('requestQrImg');
  img.src = qrUrl;
  img.style.display = 'block';
  img.onerror = function() {
    img.style.display = 'none';
    document.getElementById('qrFallback').classList.remove('d-none');
    document.getElementById('qrFallback').innerHTML = '<strong>Doc No:</strong> ' + docNo;
  };
  requestSuccessModal.show();
}

// ==================== TOAST ====================
function showToast(msg, type) {
  const toast = document.getElementById('liveToast');
  document.getElementById('toastTitle').textContent = type === 'danger' ? 'Error' : (type === 'success' ? 'Success' : 'Info');
  document.getElementById('toastBody').textContent = msg;
  toast.className = 'toast align-items-center text-white bg-' + type;
  bootstrap.Toast.getOrCreateInstance(toast).show();
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  if (!localStorage.getItem('sheetId_MRIF') && !localStorage.getItem('sheetId_MRR')) {
    setTimeout(() => settingsModal.show(), 500);
  }
  selectModule('MRIF');
});
